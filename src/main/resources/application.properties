# -- Server --
server.port=${PORT:8081}

# -- CORS --
cors.allowed-origins=https://xpress-pay-mu.vercel.app

# -- Database --
spring.datasource.url=${DATABASE_URL}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


jwt.secret=${JWT_SECRET}

paystack.secret.key=${PAYSTACK_SECRET_KEY}
paystack.base.url=https://api.paystack.co
paystack.callback.url=http://localhost:3000/receipt

xpresspay.public-key=${XPRESSPAY_PUBLIC_KEY}
xpresspay.private-key=${XPRESSPAY_PRIVATE_KEY}
# test: https://billerstest.xpresspayments.com:9603/api/v1
# live: https://billerservices.xpresspayments.com:9610/api/v1
xpresspay.base-url=https://billerstest.xpresspayments.com:9603/api/v1

spring.profiles.active=${SPRING_PROFILE:dev}

# -- Wallet --
wallet.signup-bonus=${WALLET_SIGNUP_BONUS:5000}

# -- Email (Resend) - only used under the prod profile --
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:PayXpress <auth@payxpress.ng>}

# -- Admin dashboard --
# NOT production-grade auth - single shared header key. Replace before real launch.
admin.api-key=${ADMIN_API_KEY:changeme-admin-key}

# Local dev overrides. MockEmailService is active under this profile.
logging.level.com.payxpress=DEBUG

