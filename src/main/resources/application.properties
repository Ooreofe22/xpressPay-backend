# -- Server --
server.port=8080

# -- CORS --
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# -- Database --
spring.datasource.url=jdbc:postgresql://localhost:5432/XpressPay
spring.datasource.username=postgres
spring.datasource.password=REDACTED
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# -- JWT --
jwt.secret=REDACTED
# generate with: openssl rand -base64 32

# -- Paystack --
paystack.secret.key=REDACTED
paystack.base.url=https://api.paystack.co
paystack.callback.url=http://localhost:3000/receipt

# -- XpressPay Biller Services --
xpresspay.public-key=REDACTED
xpresspay.private-key=REDACTED
# test: https://billerstest.xpresspayments.com:9603/api/v1
# live: https://billerservices.xpresspayments.com:9610/api/v1
xpresspay.base-url=https://billerstest.xpresspayments.com:9603/api/v1

# -- Profile --
spring.profiles.active=${SPRING_PROFILE:dev}
